<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>場所・詳細</title>
    <!--
      【若者】参加した依頼の場所・詳細(helper-place.html?id=依頼ID)。本人確認の後に来る。
      [取消] で参加をやめて「助けに行く」へ、[到着しました] で待機中(helper-gather.html)へ。
      この画面を開いている間、共有を選んだ人は現在地をお年寄りに知らせる(location-share.js)。
      [合言葉を鳴らす] で自分の音の合言葉を鳴らし、お年寄りのスマホが聞き取ると到着になる(helper-sound-code.js)。
      ページ一覧と URL は docs/features/pages.md、デザインは docs/design.md を見てください。
    -->
    <link rel="stylesheet" href="./template.css" />
    <style>
      /* スマホを近づけて到着(helper-sound-code.js) */
      .sound-wave {
        margin: 0;
        font-size: 3rem;
        animation: sound-pulse 1s ease-in-out infinite;
      }
      @keyframes sound-pulse {
        50% {
          transform: scale(1.15);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sound-wave {
          animation: none;
        }
      }
    </style>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;display=swap" />
    <script src="./design-theme.js"></script>
    <link rel="stylesheet" href="./snow-ui.css" />
    <link rel="stylesheet" href="./snow-pixel.css" />
  </head>
  <body class="for-helper has-tab-bar">
    <main>
      <div class="brand-line"><a href="./" aria-label="ユキカキ・レイド ホーム">ユキカキ・レイド</a><span>美唄</span></div>
      <header class="page-head">
        <h1>目的地</h1>
      </header>
      <div class="card">
        <div id="detail-map" class="map-box tall"></div>
        <div class="row"><span>住所</span><span id="address">読み込み中です…</span></div>
        <div class="row"><span>募集者</span><span id="elder-name"></span></div>
        <div class="row"><span>雪の多さ</span><span id="amount"></span></div>
        <div class="row"><span>参加者</span><span id="helper-count"></span></div>
        <p id="tools" class="note"></p>
      </div>
      <section id="share-card" class="card share-card" aria-label="位置の共有">
        <h2>📍 位置の共有</h2>
        <div id="share-ask" hidden>
          <p>到着まで、お年寄りにあなたの位置が見えます。</p>
          <div class="button-row">
            <button id="share-no" class="button secondary" type="button">共有しない</button>
            <button id="share-yes" class="button" type="button">位置を共有する</button>
          </div>
        </div>
        <p id="share-status" class="note" role="status"></p>
        <button id="share-toggle" class="button secondary" type="button" hidden></button>
        <button id="share-fake" class="button secondary" type="button" hidden>🧪 位置をまねる</button>
      </section>
      <section id="sound-card" class="card center sound-card" aria-label="スマホを近づけて到着">
        <h2>📡 スマホを近づけて到着</h2>
        <button id="sound-play" class="button" type="button">📡 合言葉を鳴らす</button>
        <div id="sound-playing" hidden>
          <p class="sound-wave" aria-hidden="true">🔊</p>
          <p><strong>鳴らしています</strong><br />お年寄りのスマホに近づけてね</p>
          <div class="button-row">
            <button id="sound-band" class="button secondary" type="button">聞こえる音にする</button>
            <button id="sound-stop" class="button secondary" type="button">とめる</button>
          </div>
        </div>
        <p id="sound-error" class="error" role="alert" hidden></p>
      </section>
      <div class="button-row">
        <button id="leave-button" class="button secondary" type="button">参加をやめる</button>
        <button id="arrive-button" class="button" type="button">到着しました</button>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <nav class="tab-bar" aria-label="若者のメニュー">
      <a href="./ranking.html?list=1">ランキング</a>
      <a href="./go-help.html?list=1">助けに行く</a>
    </nav>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./helper-place.js"></script>
  </body>
</html>
