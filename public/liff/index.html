<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>美唄ハッカソン LIFF</title>
    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
        line-height: 1.7;
        color: #1f2933;
        background: #f4f6f8;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 20px;
        border-radius: 12px;
        background: #fff;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
      }
      #status {
        margin: 0 0 12px;
        font-weight: 600;
      }
      #status.error {
        color: #b42318;
      }
      dl {
        margin: 0;
      }
      dt {
        font-size: 0.8rem;
        color: #52606d;
      }
      dd {
        margin: 0 0 8px;
      }
      button {
        width: 100%;
        min-height: 44px;
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        font-size: 1rem;
        color: #fff;
        background: #06c755;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>美唄ハッカソン LIFF</h1>
      <p id="status" role="status">読み込み中です…</p>
      <dl id="details" hidden>
        <dt>開いている場所</dt>
        <dd id="where"></dd>
        <dt>ログイン</dt>
        <dd id="login"></dd>
        <dt>表示名</dt>
        <dd id="name"></dd>
      </dl>
      <button id="login-button" type="button" hidden>LINE でログイン</button>
    </main>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
