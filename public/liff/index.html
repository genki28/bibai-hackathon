<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>美唄ハッカソン LIFF</title>
    <!--
      LIFF のトップ(動作確認と雪の予報)。若者のトーン(夜空)で、アプリの顔として「ユキカキ・レイド」を見せる。
      デザインは docs/design.md を見てください。
    -->
    <!-- 見出し・数字の字(M PLUS Rounded 1c)。読み込めないときは端末の字で表示される -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap"
    />
    <link rel="stylesheet" href="./template.css" />
    <style>
      .hero {
        margin: 8px 0 4px;
        text-align: center;
      }
      .hero-icon {
        margin: 0;
        font-size: 3rem;
        line-height: 1.2;
      }
      .hero-sub {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 700;
        color: var(--sub);
      }
      .hero-sub strong {
        color: var(--gold);
      }
      #status {
        margin: 0 0 12px;
        font-weight: 700;
      }
      #status.error {
        color: var(--error);
      }
      dl {
        margin: 0;
      }
      dt {
        font-size: 0.8rem;
        color: var(--sub);
      }
      dd {
        margin: 0 0 8px;
        font-weight: 700;
      }
      .weather h2 {
        margin: 0 0 4px;
      }
      .weather p {
        margin: 0;
        white-space: pre-line;
      }
      .weather .weather-note {
        margin-top: 4px;
        font-size: 0.75rem;
        color: var(--sub);
      }
    </style>
  </head>
  <body class="for-helper">
    <main>
      <header class="hero">
        <p class="kicker">YUKIKAKI RAID</p>
        <p class="hero-icon" aria-hidden="true">❄️⛄❄️</p>
        <h1>美唄ハッカソン LIFF</h1>
        <p class="hero-sub">みんなで雪かき、美唄の仲間を <strong>×2</strong> に</p>
      </header>
      <section class="card">
        <p id="status" role="status">読み込み中です…</p>
        <dl id="details" hidden>
          <dt>開いている場所</dt>
          <dd id="where"></dd>
          <dt>ログイン</dt>
          <dd id="login"></dd>
          <dt>表示名</dt>
          <dd id="name"></dd>
        </dl>
        <button id="login-button" class="button" type="button" hidden>LINE でログイン</button>
        <a class="button secondary" href="./identity.html">本人確認(デモ)へ</a>
      </section>
      <section class="card weather" aria-labelledby="weather-title">
        <h2 id="weather-title">❄ 美唄の雪の予報</h2>
        <p id="weather-text">読み込み中です…</p>
        <p class="weather-note">データ: Open-Meteo</p>
      </section>
    </main>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
