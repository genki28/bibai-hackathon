<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ユキカキ・レイド | 美唄の雪かき</title>
    <!--
      LIFF のトップ(動作確認と雪の予報)。若者のトーン(夜空)で、アプリの顔として「ユキカキ・レイド」を見せる。
      デザインは docs/design.md を見てください。
    -->
    <link rel="stylesheet" href="./template.css" />
    <style>
      .hero {
        margin: 8px 0 4px;
        text-align: center;
      }
      .hero-icon {
        margin: 0;
        font-size: 3rem;
        line-height: 1.2;
      }
      .hero-sub {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 700;
        color: var(--sub);
      }
      .hero-sub strong {
        color: var(--gold);
      }
      #status {
        margin: 0 0 12px;
        font-weight: 700;
      }
      #status.error {
        color: var(--error);
      }
      dl {
        margin: 0;
      }
      dt {
        font-size: 0.8rem;
        color: var(--sub);
      }
      dd {
        margin: 0 0 8px;
        font-weight: 700;
      }
      .weather h2 {
        margin: 0 0 4px;
      }
      .weather p {
        margin: 0;
        white-space: pre-line;
      }
      .weather .weather-note {
        margin-top: 4px;
        font-size: 0.75rem;
        color: var(--sub);
      }
    </style>
    <link rel="stylesheet" href="./snow-ui.css" />
  </head>
  <body class="for-helper">
    <main>
      <div class="brand-line"><a href="./" aria-label="ユキカキ・レイド ホーム"><span class="brand-mark" aria-hidden="true">＊</span> ユキカキ・レイド</a><span>北海道 美唄</span></div>
      <header class="hero">
        <p class="kicker">YUKIKAKI RAID</p>
        <img class="town-scene" src="./images/snow-town.svg" alt="雪のまちで、仲間と一緒に雪かき" />
        <h1>雪の日が、<br />誰かとつながる日に。</h1>
        <p class="hero-sub">みんなで雪かき、美唄の仲間を <strong>×2</strong> に</p>
      </header>
      <nav class="home-actions" aria-label="やりたいことを選ぶ">
        <a class="button" href="./go-help.html">雪かきに参加する</a>
        <a class="button home-elder" href="./help-request.html">雪かきの助けを呼ぶ</a>
        <a class="text-link" href="./ranking.html?list=1">まちのランキングを見る</a>
      </nav>
      <details class="card connection-details">
        <summary>接続・本人確認の情報</summary>
        <p id="status" role="status">読み込み中です…</p>
        <dl id="details" hidden>
          <dt>開いている場所</dt>
          <dd id="where"></dd>
          <dt>ログイン</dt>
          <dd id="login"></dd>
          <dt>表示名</dt>
          <dd id="name"></dd>
        </dl>
        <button id="login-button" class="button" type="button" hidden>LINE でログイン</button>
        <a class="button secondary" href="./identity.html">本人確認(デモ)へ</a>
      </details>
      <section class="card weather" aria-labelledby="weather-title">
        <h2 id="weather-title">❄ 美唄の雪の予報</h2>
        <p id="weather-text">読み込み中です…</p>
        <p class="weather-note">データ: Open-Meteo</p>
      </section>
    </main>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
