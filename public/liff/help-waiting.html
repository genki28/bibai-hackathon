<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>助けを待っています</title>
    <!--
      【お年寄り】助けを呼んだ後の待機画面。リッチメニューの「たすけて」を押したとき、すでに呼んでいればこの画面になる。
      ひな形です。灰色の点線の箱(.placeholder)に、デザインや中身を入れていきます。
      ページ一覧と URL は docs/features/pages.md を見てください。
    -->
    <link rel="stylesheet" href="./template.css" />
  </head>
  <body class="for-elder">
    <main>
      <span class="badge">ひな形</span>
      <!-- 待っている間 -->
      <section id="step-waiting">
        <h1>おねがいしました</h1>
        <h2>いまの様子</h2>
        <p id="request-status" class="placeholder">受注状況: お待ちください(だれかが向かうと「向かっています」に変わる予定)</p>
        <p id="request-detail" class="note"></p>
        <button id="cancel-button" class="button danger" type="button">取り消す</button>
        <!-- 雪かきが終わったら、いいねの画面へ(いまは確認用のリンク) -->
        <a class="button secondary" href="./thanks.html">(確認用)雪かきが終わった → いいね画面へ</a>
      </section>

      <!-- 取り消した後 -->
      <section id="step-cancelled" hidden>
        <h1>取り消しました</h1>
        <p class="note">また雪かきが必要になったら、メニューの「たすけて」を押してください。</p>
      </section>
    </main>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./help-waiting.js"></script>
  </body>
</html>
