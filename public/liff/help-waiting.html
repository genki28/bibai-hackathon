<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>助けを待っています</title>
    <!--
      【お年寄り】助けを呼んだ後の待機画面。リッチメニューの「たすけて」を押したとき、すでに呼んでいればこの画面になる。
      受注状況を数秒ごとに更新する: お待ちください → 受注が完了しました(向かってくる人の名前)→ 雪かき中です → 終わったら「いいねを送る」。
      向かっている人がいる間は、地図にその人の現在地と「あと約〇分」を出す(elder-live-map.js)。
      ページ一覧と URL は docs/features/pages.md、デザインは docs/design.md(お年寄りのトーン)を見てください。
    -->
    <link rel="stylesheet" href="./template.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      /* やさしい冬のトーン。状態のアイコンを大きな丸に入れる */
      #status-icon {
        display: grid;
        place-items: center;
        width: 132px;
        height: 132px;
        margin: 8px auto 12px;
        border: 3px solid #f6c9a6;
        border-radius: 50%;
        font-size: 4rem;
        line-height: 1;
        background: radial-gradient(circle, #fff4ea 0%, #ffe3cc 100%);
      }
      #request-status {
        margin: 0;
        font-family: var(--font-display);
        font-size: 1.6rem;
        font-weight: 800;
        color: #9a3412;
      }
      #request-helpers {
        font-size: 1.3rem;
        font-weight: 700;
      }
      /* 進みぐあい(おねがい → 向かっています → 雪かき中 → おわり)。body の data-status で色を付ける */
      .elder-steps {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
        margin: 12px 0 8px;
        padding: 0;
        list-style: none;
        counter-reset: step;
      }
      .elder-steps li {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.3;
        text-align: center;
        color: #52606d;
      }
      .elder-steps li::before {
        content: counter(step);
        counter-increment: step;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        margin-bottom: 4px;
        border: 3px solid #e4e7eb;
        border-radius: 50%;
        font-family: var(--font-display);
        font-weight: 800;
        background: #fff;
      }
      /* いまの段階と、それより前の段階をオレンジにする */
      body[data-status="waiting"] li[data-step="waiting"],
      body[data-status="accepted"] li:is([data-step="waiting"], [data-step="accepted"]),
      body[data-status="working"] li:not([data-step="done"]),
      body[data-status="done"] li {
        color: #9a3412;
      }
      body[data-status="waiting"] li[data-step="waiting"]::before,
      body[data-status="accepted"] li:is([data-step="waiting"], [data-step="accepted"])::before,
      body[data-status="working"] li:not([data-step="done"])::before,
      body[data-status="done"] li::before {
        border-color: var(--warm);
        color: #fff;
        background: var(--warm-deep);
      }
      #step-cancelled {
        text-align: center;
      }
      /* 来てくれる人の現在地(elder-live-map.js)。お年寄り向けに地図も文字も大きく */
      .live-section {
        margin: 24px 0 8px;
      }
      .live-section h2 {
        margin: 0 0 12px;
        font-size: 1.3rem;
        color: #235341;
      }
      #live-map {
        height: 340px;
        border: 1px solid #cadcd2;
        border-radius: 16px;
        overflow: hidden;
        background: #e4ece7;
      }
      .live-list {
        margin: 14px 0 0;
        padding: 0;
        list-style: none;
      }
      .live-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 14px 16px;
        margin-bottom: 10px;
        border: 1px solid #cadcd2;
        border-left: 6px solid #a84320;
        border-radius: 12px;
        background: #fff;
      }
      .live-row.is-arrived {
        border-left-color: #286250;
      }
      .live-row.is-no-location {
        border-left-color: #9aa9a3;
      }
      .live-main {
        font-size: 1.35rem;
        font-weight: 800;
        line-height: 1.5;
        overflow-wrap: anywhere;
        color: #243d3a;
      }
      .live-sub {
        font-size: 1.05rem;
        color: #536762;
      }
      /* 地図の上の、若者のアイコンと名前の札(map.js の showPersonMarker) */
      .person-marker {
        background: transparent;
        border: 0;
      }
      .person-marker-icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 3px solid #fff;
        border-radius: 50%;
        font-size: 1.5rem;
        line-height: 1;
        background: #a84320;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      }
      .leaflet-tooltip.person-label {
        padding: 2px 8px;
        font-size: 1rem;
        font-weight: 800;
        color: #243d3a;
      }
    </style>
    <link rel="stylesheet" href="./snow-ui.css" />
  </head>
  <body class="for-elder">
    <main>
      <div class="brand-line"><a href="./" aria-label="ユキカキ・レイド ホーム"><span class="brand-mark" aria-hidden="true">＊</span> ユキカキ・レイド</a><span>北海道 美唄</span></div>
      <!-- 待っている間 -->
      <section id="step-waiting">
        <p class="elder-eyebrow">美唄の雪かき おたすけサービス</p>
        <h1 id="waiting-title">雪かきの<br />おねがい状況</h1>
        <p class="elder-intro">いまの様子を、こちらでお知らせします。</p>
        <ol class="elder-steps" aria-label="進みぐあい">
          <li data-step="waiting">おねがい</li>
          <li data-step="accepted">むかって<br />います</li>
          <li data-step="working">雪かき中</li>
          <li data-step="done">おわり</li>
        </ol>
        <h2 class="center status-heading">いまの様子</h2>
        <div class="elder-status-panel" role="status" aria-live="polite">
        <p id="status-icon" class="big-number" aria-hidden="true">⏳</p>
        <p id="request-status" class="center"><strong>読み込み中です…</strong></p>
        <p id="request-helpers" class="center"></p>
        </div>
        <section id="live-section" class="live-section" aria-label="来てくれる人の現在地" hidden>
          <h2>いま来てくれている人</h2>
          <div id="live-map" role="img" aria-label="来てくれる人の現在地の地図"></div>
          <ul id="live-list" class="live-list" aria-live="polite"></ul>
          <p class="note">「あと約〇分」は、まっすぐ歩いたときの目安です。</p>
        </section>
        <p id="request-detail" class="note center"></p>
        <a id="thanks-link" class="button" href="./thanks.html" hidden>ありがとうを伝える</a>
        <button id="cancel-button" class="button danger" type="button" hidden>おねがいを取り消す</button>
        <p class="note center">この画面は自動で更新されます。
          何度も押す必要はありません。</p>
        <p id="error" class="error" role="alert" hidden></p>
      </section>

      <!-- 取り消した後 -->
      <section id="step-cancelled" hidden>
        <p class="big-number" aria-hidden="true">🏠</p>
        <h1>取り消しました。</h1>
        <p class="note">また雪かきが必要になったら、メニューの「たすけて」を押してください。</p>
      </section>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./help-waiting.js"></script>
  </body>
</html>
