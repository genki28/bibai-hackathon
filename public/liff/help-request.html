<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>雪かきをおねがいする</title>
    <!--
      お年寄り向けの「助けを呼ぶ」フォームです。
      見た目(このファイルの <style> と文章)は自由に変えて OK。
      ただし、id="..." と name="amount" / value="..." は動きに使っているので変えないこと。
      詳しくは docs/guides/help-request-form-for-gemini.md を見てください。
    -->
    <style>
      :root {
        --purple: #642ce8;
        --purple-dark: #4f1ec9;
        --text: #333333;
        --sub: #555555;
        --bg: #eef0f6;
        --card: #f8f9fc;
        --border: #d9d9d9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px 12px;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 24px 20px;
        border: 5px solid #e2e4ec;
        border-radius: 32px;
        background: var(--card);
      }
      .name-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      .name-row label {
        font-size: 1.35rem;
        color: var(--sub);
        white-space: nowrap;
      }
      .name-row input {
        flex: 1;
        min-width: 0;
        height: 44px;
        padding: 6px 12px;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        font-family: inherit;
        font-size: 1rem;
        color: var(--text);
        background: #ffffff;
      }
      .name-row input::placeholder {
        color: #888888;
        font-size: 0.9rem;
      }
      .location-btn {
        display: block;
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 10px;
        font-family: inherit;
        font-size: 1.15rem;
        font-weight: 700;
        color: #ffffff;
        background: var(--purple);
        cursor: pointer;
      }
      .location-btn:hover,
      .location-btn:active {
        background: var(--purple-dark);
      }
      .location-box {
        margin-top: 12px;
        padding: 12px;
        border: 1.5px solid #444444;
        background: #ffffff;
        color: var(--sub);
        font-size: 1.05rem;
        text-align: center;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        word-break: break-word;
      }
      .depth-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
      }
      .depth-row label {
        font-size: 1.25rem;
        color: var(--sub);
        white-space: nowrap;
      }
      .depth-row select {
        width: 168px;
        height: 40px;
        padding: 4px 10px;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        font-family: inherit;
        font-size: 1rem;
        color: var(--text);
        background: #ffffff;
      }
      .optional-note {
        margin: 18px 0 14px;
        color: #d62828;
        font-size: 0.92rem;
        text-align: center;
      }
      .tools-title {
        margin: 0 0 8px;
        font-size: 1.05rem;
        color: var(--sub);
      }
      .tool-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tool-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .tool-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.05rem;
        color: var(--sub);
        cursor: pointer;
        flex: 1;
      }
      .tool-label input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--purple);
        cursor: pointer;
      }
      .tool-count {
        width: 58px;
        height: 36px;
        padding: 2px 6px;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.95rem;
        color: var(--text);
        background: #ffffff;
        text-align: center;
      }
      .submit-btn {
        display: block;
        width: 100%;
        height: 78px;
        margin-top: 28px;
        border: 0;
        border-radius: 14px;
        font-family: inherit;
        font-size: 1.65rem;
        font-weight: 700;
        color: #ffffff;
        background: var(--purple);
        cursor: pointer;
      }
      .submit-btn:hover,
      .submit-btn:active {
        background: var(--purple-dark);
      }
      .cancel-link-wrap {
        margin-top: 10px;
        text-align: center;
      }
      .cancel-btn {
        border: 0;
        background: transparent;
        color: var(--sub);
        font-family: inherit;
        font-size: 0.9rem;
        text-decoration: underline;
        cursor: pointer;
      }
      .spinner {
        width: 52px;
        height: 52px;
        margin: 16px auto;
        border: 6px solid #e6defa;
        border-top-color: var(--purple);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
      #error {
        margin-top: 14px;
        color: #b42318;
        font-weight: 700;
        text-align: center;
      }
      .preview-note {
        margin: 0 0 12px;
        padding: 8px;
        border-radius: 8px;
        font-size: 0.85rem;
        background: #fff4d6;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="preview-note" class="preview-note" hidden>
        おためし表示中です。依頼は送られません。
      </p>

      <!-- 1. 最初の画面 -->
      <section id="step-ask">
        <div class="name-row">
          <label for="requester-name">名前：</label>
          <input
            id="requester-name"
            name="requesterName"
            type="text"
            placeholder="ここに入力"
            autocomplete="name"
          />
        </div>

        <button id="location-button" class="location-btn" type="button">
          位置情報を取得
        </button>

        <div id="location-display" class="location-box" aria-live="polite">
          ここに位置情報を表示
        </div>

        <div class="depth-row">
          <label for="snow-amount">雪の深さ：</label>
          <select id="snow-amount" name="amount">
            <option value="little">くるぶしくらい</option>
            <option value="normal" selected>ひざくらい</option>
            <option value="lots">こし以上</option>
          </select>
        </div>

        <p class="optional-note">※以下、お持ちでしたら記入してください</p>

        <p class="tools-title">道具：</p>
        <div class="tool-list">
          <div class="tool-item">
            <label class="tool-label" for="tool-plastic-scoop">
              <input id="tool-plastic-scoop" name="toolPlasticScoop" type="checkbox" checked />
              <span>スコップ（プラスチック）</span>
            </label>
            <input
              id="count-plastic-scoop"
              name="countPlasticScoop"
              class="tool-count"
              type="number"
              min="0"
              value="0"
              aria-label="スコップ（プラスチック）の数"
            />
          </div>

          <div class="tool-item">
            <label class="tool-label" for="tool-steel-scoop">
              <input id="tool-steel-scoop" name="toolSteelScoop" type="checkbox" checked />
              <span>スコップ（スチール類）</span>
            </label>
            <input
              id="count-steel-scoop"
              name="countSteelScoop"
              class="tool-count"
              type="number"
              min="0"
              value="0"
              aria-label="スコップ（スチール類）の数"
            />
          </div>

          <div class="tool-item">
            <label class="tool-label" for="tool-mama-dump">
              <input id="tool-mama-dump" name="toolMamaDump" type="checkbox" checked />
              <span>ママさんダンプ</span>
            </label>
            <input
              id="count-mama-dump"
              name="countMamaDump"
              class="tool-count"
              type="number"
              min="0"
              value="0"
              aria-label="ママさんダンプの数"
            />
          </div>
        </div>

        <button id="call-button" class="submit-btn" type="button">送信</button>

        <div class="cancel-link-wrap">
          <button id="cancel-button" class="cancel-btn" type="button">やめる</button>
        </div>
      </section>

      <!-- 2. 送っている途中 -->
      <section id="step-sending" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p role="status">おねがいしています…</p>
      </section>

      <!-- 3. 送れた -->
      <section id="step-done" hidden>
        <h1>おねがいしました</h1>
        <p>だれかが来るときは、LINE でお知らせします。</p>
        <button id="close-button" class="submit-btn" type="button">とじる</button>
      </section>

      <p id="error" role="alert" hidden></p>
    </main>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./help-request.js"></script>
  </body>
</html>
