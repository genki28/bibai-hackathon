<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>雪かきをおねがいする</title>
    <!--
      【お年寄り】「助けを呼ぶ」フォーム(help-request.html)。動きは help-request.js。
      見た目は、ほかの画面と同じ共通の CSS(template.css / snow-ui.css / snow-pixel.css)に合わせている。
      id="..." と name="..." は動きに使っているので変えないこと。詳しくは docs/guides/help-request-form-for-gemini.md。
      [現在地を取得] を押すと、現在地を name="lat" / "lng" に入れ、地図にピンを立てる(住所は聞かない)。
      道具は、チェックした物と数を「スコップ(プラスチック)×2、ママさんダンプ」の形にまとめて送る。
    -->
    <link rel="stylesheet" href="./template.css" />
    <style>
      /* 入力欄(共通の CSS には文字・数の入力欄の指定がないので、ここで合わせる) */
      .form-field {
        margin: 0 0 18px;
      }
      .form-field > label,
      .form-label {
        display: block;
        margin: 0 0 6px;
        font-family: var(--font-display);
        font-size: 1.1rem;
        font-weight: 800;
      }
      .text-input,
      .tool-count {
        width: 100%;
        min-height: 52px;
        padding: 8px 12px;
        border: 2px solid var(--rule, #dce1e6);
        border-radius: 6px;
        font: inherit;
        font-size: 1.1rem;
        color: var(--ink, #192e49);
        background: var(--paper, #ffffff);
      }
      .form-field select {
        margin: 0;
        font-size: 1.1rem;
      }
      /* 現在地 */
      #use-location-button {
        margin: 0;
      }
      .location-status {
        margin: 8px 0 0;
        text-align: center;
      }
      #location-map {
        height: 200px;
        margin: 8px 0 0;
      }
      /* 道具(チェック + 数) */
      .optional-note {
        margin: 24px 0 8px;
        color: var(--muted, #606c7b);
        font-size: 0.95rem;
      }
      .tool-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .tool-item {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tool-label {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        font-size: 1.05rem;
        cursor: pointer;
      }
      .tool-label input[type="checkbox"] {
        width: 24px;
        height: 24px;
        accent-color: var(--vermillion, #b73e2c);
      }
      .tool-item .tool-count {
        flex: none;
        width: 76px;
        min-height: 48px;
        text-align: center;
      }
      #call-button {
        margin-top: 28px;
        min-height: 72px;
        font-size: 1.5rem;
      }
      /* [やめる] は文字だけのボタン */
      #cancel-button {
        display: block;
        margin: 14px auto 0;
        padding: 8px 16px;
        border: 0;
        background: none;
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
      }
      .spinner {
        width: 52px;
        height: 52px;
        margin: 24px auto 12px;
        border: 6px solid var(--rule, #dce1e6);
        border-top-color: var(--vermillion, #b73e2c);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
      .preview-note {
        margin: 0 0 12px;
        padding: 8px;
        font-size: 0.875rem;
        text-align: center;
        background: #fff4d6;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;display=swap" />
    <script src="./design-theme.js"></script>
    <link rel="stylesheet" href="./snow-ui.css" />
    <link rel="stylesheet" href="./snow-pixel.css" />
  </head>
  <body class="for-elder">
    <main>
      <div class="brand-line"><a href="./" aria-label="ユキカキ・レイド ホーム">ユキカキ・レイド</a><span>美唄</span></div>
      <p id="preview-note" class="preview-note" hidden>おためし表示中です。依頼は送られません。</p>

      <!-- 1. 最初の画面 -->
      <section id="step-ask">
        <header class="page-head">
          <h1>雪かきをおねがいする</h1>
        </header>

        <div class="form-field">
          <label for="requester-name">お名前</label>
          <input id="requester-name" class="text-input" name="name" type="text" placeholder="例: 美唄 花子" autocomplete="name" />
        </div>

        <div class="form-field">
          <p class="form-label">場所</p>
          <button id="use-location-button" class="button secondary" type="button"><img class="ui-icon" src="./icons/pin.svg" alt="" aria-hidden="true" />現在地を取得</button>
          <p id="location-display" class="location-status note" aria-live="polite">家の前で押してください</p>
          <div id="location-map" class="map-box" hidden></div>
          <input name="lat" type="hidden" />
          <input name="lng" type="hidden" />
        </div>

        <div class="form-field">
          <label for="snow-amount">雪の深さ</label>
          <select id="snow-amount" name="amount">
            <option value="little">くるぶしくらい</option>
            <option value="normal" selected>ひざくらい</option>
            <option value="lots">こし以上</option>
          </select>
        </div>

        <p class="optional-note">ここから下は、お持ちでしたら</p>
        <fieldset class="tool-list">
          <legend class="form-label">道具</legend>
          <div class="tool-item">
            <label class="tool-label" for="tool-plastic-scoop">
              <input id="tool-plastic-scoop" name="toolPlasticScoop" type="checkbox" data-tool="スコップ(プラスチック)" />
              <span>スコップ(プラスチック)</span>
            </label>
            <input id="count-plastic-scoop" class="tool-count" type="number" min="0" max="9" value="1" inputmode="numeric" aria-label="スコップ(プラスチック)の数" />
          </div>
          <div class="tool-item">
            <label class="tool-label" for="tool-steel-scoop">
              <input id="tool-steel-scoop" name="toolSteelScoop" type="checkbox" data-tool="スコップ(スチール)" />
              <span>スコップ(スチール)</span>
            </label>
            <input id="count-steel-scoop" class="tool-count" type="number" min="0" max="9" value="1" inputmode="numeric" aria-label="スコップ(スチール)の数" />
          </div>
          <div class="tool-item">
            <label class="tool-label" for="tool-mama-dump">
              <input id="tool-mama-dump" name="toolMamaDump" type="checkbox" data-tool="ママさんダンプ" />
              <span>ママさんダンプ</span>
            </label>
            <input id="count-mama-dump" class="tool-count" type="number" min="0" max="9" value="1" inputmode="numeric" aria-label="ママさんダンプの数" />
          </div>
        </fieldset>

        <button id="call-button" class="button" type="button">おねがいする</button>
        <button id="cancel-button" class="text-link" type="button">やめる</button>
      </section>

      <!-- 2. 送っている途中 -->
      <section id="step-sending" class="center" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p role="status">おねがいしています…</p>
      </section>

      <!-- 3. 送れた(おためし表示のときだけ。ふだんは待機画面へ移る) -->
      <section id="step-done" class="center" hidden>
        <h1>おねがいしました</h1>
        <p>だれかが来るときは、LINE でお知らせします。</p>
        <button id="close-button" class="button" type="button">とじる</button>
      </section>

      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./help-request.js"></script>
  </body>
</html>
