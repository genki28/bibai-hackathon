<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ランキング</title>
    <!--
      【若者】ランキング。4 種類のポイントの合計で順位を出す(docs/features/04-ranking.md)。
      ひな形です。灰色の点線の箱(.placeholder)に、デザインや中身を入れていきます。

    -->
    <link rel="stylesheet" href="./template.css" />

    <main>

      <a class="button" href="./go-help.html">助けに行く</a>
      <button class="button secondary" type="button" disabled>友だちを誘う(あとで作る)</button>

    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
