<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ランキング</title>
    <!--
      【若者】ランキング。「デイリー(日本時間の今日)/ 総合」を切り替えて、ポイントの多い順に出す。
      上位 3 人は金・銀・銅の表彰台、自分の順位は光る帯。いちばん上に「仲間ゲージ」(美唄の仲間を 2 倍に)。
      ポイント = 雪かき(作業時間・雪の重さ)+ 評価(星)+ 勧誘(友だちを誘う)+ 再会ボーナス(docs/features/04-ranking.md)。
      自分の順位の下に内訳。[友だちを誘う] で招待リンクを LINE の友だちに送る(LINE の外ではリンクをコピー)。
      ページ一覧と URL は docs/features/pages.md、デザインは docs/design.md を見てください。
    -->
    <link rel="stylesheet" href="./template.css" />
    <style>
      /* 表彰台(上位 3 人)。並びは 2 位・1 位・3 位 */
      .podium {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: end;
        gap: 8px;
        margin: 18px 0 12px;
      }
      .podium-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 0;
        padding: 12px 6px 14px;
        border: 2px solid var(--medal);
        border-radius: 20px 20px 12px 12px;
        background: rgba(255, 255, 255, 0.08); /* color-mix が使えない端末用 */
        background: linear-gradient(180deg, color-mix(in srgb, var(--medal) 28%, transparent), rgba(255, 255, 255, 0.04));
        box-shadow: 0 0 18px color-mix(in srgb, var(--medal) 45%, transparent);
        text-align: center;
      }
      .podium-card.place-1 {
        --medal: var(--gold);
        grid-area: 1 / 2;
        min-height: 200px;
      }
      .podium-card.place-2 {
        --medal: var(--silver);
        grid-area: 1 / 1;
        min-height: 170px;
      }
      .podium-card.place-3 {
        --medal: var(--bronze);
        grid-area: 1 / 3;
        min-height: 150px;
      }
      .podium-medal {
        font-size: 2rem;
        line-height: 1.1;
      }
      .place-1 .podium-medal {
        font-size: 2.5rem;
        animation: bob 2.4s ease-in-out infinite;
      }
      @keyframes bob {
        50% {
          transform: translateY(-4px);
        }
      }
      .podium-name {
        width: 100%;
        margin: 6px 0 0;
        overflow: hidden;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .podium-points {
        margin: 0;
        font-family: var(--font-display);
        font-size: 1.15rem;
        font-weight: 800;
        color: var(--medal);
      }
      .podium-card .badge {
        margin: 6px 0 0;
        font-size: 0.7rem;
      }
      /* 4 位から下 */
      .rank-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 8px 0;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--glass);
      }
      .rank-number {
        display: grid;
        flex: none;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        font-family: var(--font-display);
        font-weight: 800;
        background: rgba(255, 255, 255, 0.1);
      }
      .rank-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rank-points {
        font-family: var(--font-display);
        font-weight: 800;
        color: var(--gold);
      }
      .is-me {
        border-color: var(--ice);
        box-shadow: 0 0 16px rgba(79, 209, 255, 0.55);
      }
      .me-tag {
        display: inline-block;
        margin-left: 4px;
        padding: 0 6px;
        border-radius: 999px;
        font-size: 0.7rem;
        color: var(--night-top);
        background: var(--ice);
        vertical-align: middle;
      }
      /* 自分の順位の光る帯(スクロールしても上に残る) */
      #my-rank {
        position: sticky;
        top: 8px;
        z-index: 5;
        margin: 12px 0;
        padding: 12px 16px;
        border: 1px solid var(--ice);
        border-radius: 999px;
        font-family: var(--font-display);
        font-weight: 800;
        text-align: center;
        background: linear-gradient(100deg, rgba(79, 209, 255, 0.22), rgba(139, 92, 246, 0.3));
        box-shadow: 0 0 22px rgba(79, 209, 255, 0.45);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;display=swap" />
    <script src="./design-theme.js"></script>
    <link rel="stylesheet" href="./snow-ui.css" />
    <link rel="stylesheet" href="./snow-pixel.css" />
  </head>
  <body class="for-helper has-tab-bar">
    <main>
      <div class="brand-line"><a href="./" aria-label="ユキカキ・レイド ホーム">ユキカキ・レイド</a><span>美唄</span></div>
      <header class="page-head">
        <h1>ランキング</h1>
      </header>
      <div class="toggle" role="group" aria-label="期間">
        <button id="daily-button" type="button" aria-pressed="true">今日</button>
        <button id="total-button" type="button" aria-pressed="false">これまで</button>
      </div>
      <p id="my-rank" aria-live="polite"></p>
      <details id="breakdown-details" class="quiet-details" hidden>
        <summary>ポイントの内訳</summary>
        <p id="my-breakdown" class="note" hidden></p>
      </details>
      <div id="ranking-list">
        <p class="note center">読み込み中です…</p>
      </div>
      <section id="community-gauge" class="card" aria-label="仲間ゲージ">
        <p class="note center">仲間ゲージを読み込み中です…</p>
      </section>
      <section class="card center" aria-labelledby="invite-title">
        <h2 id="invite-title">友だちと参加しよう</h2>
        <p class="note">友だちの初回完了で、あなたに500pt。友だちにも200pt。</p>
        <button id="invite-button" class="button" type="button">友だちを誘う</button>
        <p id="invite-status" class="note" aria-live="polite" hidden></p>
      </section>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <nav class="tab-bar" aria-label="若者のメニュー">
      <a href="./ranking.html?list=1" aria-current="page">ランキング</a>
      <a href="./go-help.html?list=1">助けに行く</a>
    </nav>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./ranking.js"></script>
  </body>
</html>
