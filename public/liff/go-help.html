<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>助けに行く</title>
    <!--
      【若者】助けに行くページ。一覧 → 場所(大まかな地図)→ 確認の小窓 →(参加)→ 本人確認(identity.html)→ 場所・詳細(helper-place.html)。
      依頼は「クエスト」のカードで見せる(雪の多さ = 雪の結晶 1〜3 個、参加 〇/5)。確認の小窓はレイドの参加画面風。
      ページ一覧と URL は docs/features/pages.md、デザインは docs/design.md を見てください。
    -->
    <!-- 見出し・数字の字(M PLUS Rounded 1c)。読み込めないときは端末の字で表示される -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap"
    />
    <link rel="stylesheet" href="./template.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      #waiting-count {
        margin: 0 0 12px;
        font-family: var(--font-display);
        font-size: 1.3rem;
        font-weight: 800;
        color: var(--gold);
      }
      /* クエストのカード */
      .pick-list .quest-card {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 10px;
        padding: 14px 16px;
        border: 1px solid var(--glass-edge);
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(79, 209, 255, 0.14), rgba(139, 92, 246, 0.16));
        box-shadow: 0 6px 20px rgba(3, 6, 20, 0.35);
        transition: transform 0.12s ease;
      }
      .pick-list .quest-card:active {
        transform: scale(0.98);
      }
      .quest-tag {
        grid-column: 1 / -1;
        justify-self: start;
        padding: 0 8px;
        border-radius: 6px;
        font-family: var(--font-display);
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: var(--night-top);
        background: var(--ice);
      }
      .quest-title {
        font-family: var(--font-display);
        font-size: 1.15rem;
        font-weight: 800;
      }
      .quest-difficulty {
        align-self: center;
        font-size: 1.1rem;
        letter-spacing: 2px;
        color: var(--ice);
        text-shadow: 0 0 8px rgba(79, 209, 255, 0.8);
      }
      .quest-meta {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 4px 10px;
        font-size: 0.85rem;
        color: var(--sub);
      }
      .party-pips {
        display: inline-flex;
        gap: 3px;
        margin-right: 6px;
        vertical-align: middle;
      }
      .party-pips i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
      }
      .party-pips i.filled {
        background: var(--gold);
        box-shadow: 0 0 6px var(--gold);
      }
      /* レイドの参加画面風の確認の小窓 */
      .raid-icon {
        margin: 0;
        font-size: 3rem;
        line-height: 1.2;
        animation: bob 2.4s ease-in-out infinite;
      }
      @keyframes bob {
        50% {
          transform: translateY(-6px);
        }
      }
      #confirm-title {
        margin: 4px 0 8px;
        font-size: 1.3rem;
      }
      #confirm-summary {
        margin: 8px 0;
        padding: 10px;
        border-radius: 14px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.08);
      }
      .place-info p {
        margin: 2px 0;
      }
    </style>
  </head>
  <body class="for-helper has-tab-bar">
    <main>
      <!-- 1. 依頼の一覧(クエスト掲示板) -->
      <section id="step-list">
        <header class="page-head">
          <p class="kicker">QUEST BOARD</p>
          <h1>助けに行く</h1>
        </header>
        <p id="waiting-count" class="center">読み込み中です…</p>
        <label for="area-select" class="note">エリアで絞り込む</label>
        <select id="area-select">
          <option value="">すべてのエリア</option>
        </select>
        <ul id="request-list" class="pick-list"></ul>
        <div class="button-row">
          <button id="prev-button" class="button secondary" type="button">前へ</button>
          <button id="next-button" class="button secondary" type="button">次へ</button>
        </div>
        <p id="page-info" class="note center"></p>
      </section>

      <!-- 2. 場所(大まかな地図。正確な位置は参加した後だけ見せる) -->
      <section id="step-place" hidden>
        <header class="page-head">
          <p class="kicker">QUEST INFO</p>
          <h1>クエストの場所</h1>
        </header>
        <div class="card place-info">
          <div id="rough-map" class="map-box"></div>
          <p class="note center">※ 正確な場所は、参加した後に表示されます</p>
          <p id="place-postal" class="center"></p>
          <p id="place-address" class="center"></p>
          <p id="place-detail" class="note center"></p>
        </div>
        <div class="button-row">
          <button id="back-button" class="button secondary" type="button">戻る</button>
          <button id="go-button" class="button" type="button">ここに行く!</button>
        </div>
      </section>

      <p id="error" class="error" role="alert" hidden></p>
    </main>

    <!-- 3. 確認の小窓(レイドの参加画面風) -->
    <div id="confirm-overlay" class="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <p class="kicker">JOIN THE RAID</p>
        <p class="raid-icon" aria-hidden="true">⚔️❄️</p>
        <h2 id="confirm-title">このクエストに参加しますか?</h2>
        <p id="confirm-summary"></p>
        <p class="note">参加すると本人確認に進みます。仲間と一緒に雪かきしよう!</p>
        <div class="button-row">
          <button id="confirm-back-button" class="button secondary" type="button">やめておく</button>
          <button id="confirm-button" class="button" type="button">参加する!</button>
        </div>
      </div>
    </div>

    <nav class="tab-bar" aria-label="若者のメニュー">
      <a href="./ranking.html?list=1">🏆 ランキング</a>
      <a href="./go-help.html?list=1" aria-current="page">🧤 助けに行く</a>
    </nav>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./go-help.js"></script>
  </body>
</html>
