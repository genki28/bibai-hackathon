<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>助けに行く</title>
    <!--
      【若者】助けに行くページ。一覧 → 場所(大まかな地図)→ 確認の小窓 →(参加)→ 本人確認(identity.html)→ 場所・詳細(helper-place.html)。
      ページ一覧と URL は docs/features/pages.md を見てください。
    -->
    <link rel="stylesheet" href="./template.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body class="for-helper has-tab-bar">
    <main>
      <!-- 1. 依頼の一覧 -->
      <section id="step-list">
        <h1>助けに行く</h1>
        <p id="waiting-count" class="center">読み込み中です…</p>
        <label for="area-select" class="note">エリアで絞り込む</label>
        <select id="area-select">
          <option value="">すべてのエリア</option>
        </select>
        <ul id="request-list" class="pick-list"></ul>
        <div class="button-row">
          <button id="prev-button" class="button secondary" type="button">前へ</button>
          <button id="next-button" class="button secondary" type="button">次へ</button>
        </div>
        <p id="page-info" class="note center"></p>
      </section>

      <!-- 2. 場所(大まかな地図。正確な位置は参加した後だけ見せる) -->
      <section id="step-place" hidden>
        <h1>場所</h1>
        <div id="rough-map" class="map-box"></div>
        <p class="note center">※ 正確な場所は、参加した後に表示されます</p>
        <p id="place-postal" class="center"></p>
        <p id="place-address" class="center"></p>
        <p id="place-detail" class="note center"></p>
        <div class="button-row">
          <button id="back-button" class="button secondary" type="button">戻る</button>
          <button id="go-button" class="button" type="button">ここに行く!</button>
        </div>
      </section>

      <p id="error" class="error" role="alert" hidden></p>
    </main>

    <!-- 3. 確認の小窓 -->
    <div id="confirm-overlay" class="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title">助けに行きますか?</h2>
        <p class="note">確定すると参加者になり、本人確認に進みます。</p>
        <div class="button-row">
          <button id="confirm-back-button" class="button secondary" type="button">戻る</button>
          <button id="confirm-button" class="button" type="button">確定</button>
        </div>
      </div>
    </div>

    <nav class="tab-bar" aria-label="若者のメニュー">
      <a href="./ranking.html">🏆 ランキング</a>
      <a href="./go-help.html" aria-current="page">🧤 助けに行く</a>
    </nav>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./go-help.js"></script>
  </body>
</html>
