<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>いいねを送る</title>
    <!--
      【お年寄り】いいね(thanks.html?id=依頼ID)。来てくれた人に 1 人ずつ星 1〜5 を付けて送る(1 回だけ)。
      ページ一覧と URL は docs/features/pages.md を見てください。
    -->
    <link rel="stylesheet" href="./template.css" />
    <style>
      .helper-rating {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        text-align: center;
      }
      .helper-rating .stars {
        font-size: 2.6rem;
      }
    </style>
  </head>
  <body class="for-elder">
    <main>
      <section id="step-form">
        <h1>来てくれた人に<br />いいねを送る</h1>
        <p id="loading" class="center">読み込み中です…</p>
        <!-- 来てくれた人ごとに、名前と星 5 つが入る(thanks.js が作る) -->
        <div id="helper-ratings"></div>
        <button id="send-button" class="button" type="button" hidden>送信</button>
        <p id="error" class="error" role="alert" hidden></p>
      </section>

      <section id="step-sent" hidden>
        <h1>ありがとうを<br />送りました</h1>
        <p class="big-number" aria-hidden="true">💌</p>
        <p class="center">来てくれた人に届きます。<br />雪かきのおねがい、おつかれさまでした。</p>
      </section>
    </main>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./thanks.js"></script>
  </body>
</html>
