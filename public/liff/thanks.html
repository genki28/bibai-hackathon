<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>いいねを送る</title>
    <!--
      【お年寄り】いいね(thanks.html?id=依頼ID)。来てくれた人に 1 人ずつ星 1〜5 を付けて送る(1 回だけ)。
      ページ一覧と URL は docs/features/pages.md、デザインは docs/design.md(お年寄りのトーン)を見てください。
    -->
    <link rel="stylesheet" href="./template.css" />
    <style>
      /* 来てくれた人ごとのカード。星は大きく押しやすく */
      .helper-rating {
        margin: 12px 0;
        padding: 14px 8px;
        border: 2px solid #f6c9a6;
        border-radius: 20px;
        text-align: center;
        background: #fff8f1;
      }
      .helper-rating p {
        margin: 0 0 4px;
        font-family: var(--font-display);
        font-size: 1.35rem;
        font-weight: 800;
      }
      .helper-rating .stars {
        gap: 2px;
        font-size: clamp(2.4rem, 12vw, 3rem);
      }
      .helper-rating .stars label {
        padding: 0 2px;
      }
      .sent-icon {
        display: grid;
        place-items: center;
        width: 132px;
        height: 132px;
        margin: 8px auto;
        border: 3px solid #f6c9a6;
        border-radius: 50%;
        background: radial-gradient(circle, #fff4ea 0%, #ffe3cc 100%);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;display=swap" />
    <script src="./design-theme.js"></script>
    <link rel="stylesheet" href="./snow-ui.css" />
    <link rel="stylesheet" href="./snow-pixel.css" />
  </head>
  <body class="for-elder">
    <main>
      <div class="brand-line"><a href="./" aria-label="ユキカキ・レイド ホーム">ユキカキ・レイド</a><span>美唄</span></div>
      <section id="step-form">
        <h1>ありがとうを送る</h1>
        <p class="center">来てくれた方に、星をつけてください。</p>
        <p id="loading" class="center">読み込み中です…</p>
        <!-- 来てくれた人ごとに、名前と星 5 つが入る(thanks.js が作る) -->
        <div id="helper-ratings"></div>
        <button id="send-button" class="button" type="button" hidden>ありがとうを送る</button>
        <p id="error" class="error" role="alert" hidden></p>
      </section>
      <section id="step-sent" hidden>
        <h1>ありがとうを<br />送りました</h1>
        <p class="big-number sent-icon" aria-hidden="true">💌</p>
        <p class="center">お手伝いしてくれた方へのお礼が届きました。</p>
      </section>
    </main>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./thanks.js"></script>
  </body>
</html>
