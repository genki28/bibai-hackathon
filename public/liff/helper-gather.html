<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>待機中</title>
    <!--
      【若者】到着した後の待機中(helper-gather.html?id=依頼ID)。参加者と集合の人数を数秒ごとに更新する。
      リーダー(最初に参加した人)だけ「雪かき開始」を押せる。開始されたら全員が雪かき中(helper-working.html)へ。
      ページ一覧と URL は docs/features/pages.md を見てください。
    -->
    <link rel="stylesheet" href="./template.css" />
  </head>
  <body class="for-helper has-tab-bar">
    <main>
      <h1>待機中</h1>
      <p id="gather-count" class="big-number">-/-人集合</p>
      <h2>参加者</h2>
      <ul id="helper-list" class="pick-list"></ul>
      <p id="leader-note" class="note center"></p>
      <button id="start-button" class="button" type="button" hidden>雪かき開始</button>
      <p class="note center">数秒ごとに自動で更新されます。</p>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <nav class="tab-bar" aria-label="若者のメニュー">
      <a href="./ranking.html">🏆 ランキング</a>
      <a href="./go-help.html">🧤 助けに行く</a>
    </nav>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./helper-gather.js"></script>
  </body>
</html>
