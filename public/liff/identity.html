<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本人確認(デモ)</title>
    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
        line-height: 1.7;
        color: #1f2933;
        background: #f4f6f8;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 20px;
        border-radius: 12px;
        background: #fff;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.3rem;
      }
      .demo-banner {
        margin: 0 0 16px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        color: #7a4b00;
        background: #fff4d6;
      }
      .step {
        text-align: center;
      }
      .step p {
        font-size: 1.1rem;
      }
      .icon {
        font-size: 3.5rem;
        line-height: 1.2;
      }
      .card-anim {
        animation: float 1.6s ease-in-out infinite;
      }
      @keyframes float {
        50% {
          transform: translateY(-10px);
        }
      }
      .spinner {
        width: 48px;
        height: 48px;
        margin: 12px auto;
        border: 5px solid #d9f5e4;
        border-top-color: #06c755;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .card-anim,
        .spinner {
          animation: none;
        }
      }
      button {
        width: 100%;
        min-height: 56px;
        margin-top: 12px;
        border: 0;
        border-radius: 10px;
        font-size: 1.15rem;
        font-weight: 600;
        color: #fff;
        background: #06c755;
      }
      button.secondary {
        min-height: 44px;
        font-size: 1rem;
        font-weight: 400;
        color: #1f2933;
        background: #e4e7eb;
      }
      #error {
        color: #b42318;
        font-weight: 600;
      }
      a {
        display: block;
        margin-top: 16px;
        text-align: center;
        color: #06c755;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>本人確認</h1>
      <p class="demo-banner">
        これはデモ用の画面です。実際のカードの読み取りや本人確認は行いません。
        カードの情報やマイナンバーは送信・保存されません。
      </p>

      <section id="step-loading" class="step">
        <div class="spinner" aria-hidden="true"></div>
        <p role="status">読み込み中です…</p>
      </section>

      <section id="step-intro" class="step" hidden>
        <div class="icon" aria-hidden="true">🪪</div>
        <p>マイナンバーカードで<br />本人確認をします</p>
        <button id="start-button" type="button">確認をはじめる</button>
      </section>

      <section id="step-scan" class="step" hidden>
        <div class="icon card-anim" aria-hidden="true">📱🪪</div>
        <p>マイナンバーカードを<br />スマホの背面に重ねてください</p>
        <button id="scan-button" type="button">スキャンする(デモ)</button>
        <button id="cancel-button" class="secondary" type="button">やめる</button>
      </section>

      <section id="step-checking" class="step" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p role="status">確認しています…</p>
      </section>

      <section id="step-done" class="step" hidden>
        <div class="icon" aria-hidden="true">✅</div>
        <p><strong>本人確認完了!</strong></p>
        <p id="auto-next-note" hidden>自動で画面遷移します。</p>
        <p id="verified-at"></p>
        <!-- 「助けに行く」から来たときは、1.5 秒ほどで次の画面へ自動で進む。押しても進める(?next=〇〇.html&id=依頼ID) -->
        <button id="next-button" type="button" hidden>次へ進む</button>
        <button id="reset-button" class="secondary" type="button">もう一度ためす</button>
      </section>

      <p id="error" role="alert" hidden></p>
      <a href="./">トップにもどる</a>
    </main>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./identity.js"></script>
  </body>
</html>
