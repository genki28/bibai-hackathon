<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本人確認(デモ)</title>
    <!--
      本人確認(マイナンバーカード)のデモ画面。若者が「助けに行く」で参加した後に通るので、若者のトーン(夜空)にする。
      ⚠ 実際のカードの読み取りはしない。デモの注意書き(.demo-banner)は必ず残すこと。
      デザインは docs/design.md を見てください。
    -->
    <!-- 見出し・数字の字(M PLUS Rounded 1c)。読み込めないときは端末の字で表示される -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap"
    />
    <link rel="stylesheet" href="./template.css" />
    <style>
      .demo-banner {
        margin: 0 0 16px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 201, 77, 0.6);
        border-radius: 14px;
        font-size: 0.85rem;
        color: #ffe7a8;
        background: rgba(255, 201, 77, 0.12);
      }
      .step {
        text-align: center;
      }
      .step p {
        font-size: 1.1rem;
      }
      .icon {
        display: grid;
        place-items: center;
        width: 110px;
        height: 110px;
        margin: 8px auto;
        border-radius: 50%;
        font-size: 3.2rem;
        line-height: 1;
        background: radial-gradient(circle, rgba(79, 209, 255, 0.35), rgba(139, 92, 246, 0.15) 70%);
        box-shadow: 0 0 30px rgba(79, 209, 255, 0.35);
      }
      .card-anim {
        animation: float 1.6s ease-in-out infinite;
      }
      @keyframes float {
        50% {
          transform: translateY(-10px);
        }
      }
      .spinner {
        width: 52px;
        height: 52px;
        margin: 16px auto;
        border: 5px solid rgba(255, 255, 255, 0.15);
        border-top-color: var(--ice);
        border-right-color: var(--aurora-light);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #step-done .icon {
        background: radial-gradient(circle, rgba(255, 201, 77, 0.45), rgba(255, 201, 77, 0.1) 70%);
        box-shadow: 0 0 34px rgba(255, 201, 77, 0.5);
      }
      #error {
        color: var(--error);
        font-weight: 700;
      }
      .back-link {
        display: block;
        margin-top: 16px;
        text-align: center;
        color: var(--ice);
      }
    </style>
  </head>
  <body class="for-helper">
    <main>
      <div class="card">
        <header class="page-head">
          <p class="kicker">PLAYER CHECK</p>
          <h1>本人確認</h1>
        </header>
        <p class="demo-banner">
          これはデモ用の画面です。実際のカードの読み取りや本人確認は行いません。
          カードの情報やマイナンバーは送信・保存されません。
        </p>

        <section id="step-loading" class="step">
          <div class="spinner" aria-hidden="true"></div>
          <p role="status">読み込み中です…</p>
        </section>

        <section id="step-intro" class="step" hidden>
          <div class="icon" aria-hidden="true">🪪</div>
          <p>マイナンバーカードで<br />本人確認をします</p>
          <button id="start-button" class="button" type="button">確認をはじめる</button>
        </section>

        <section id="step-scan" class="step" hidden>
          <div class="icon card-anim" aria-hidden="true">📱🪪</div>
          <p>マイナンバーカードを<br />スマホの背面に重ねてください</p>
          <button id="scan-button" class="button" type="button">スキャンする(デモ)</button>
          <button id="cancel-button" class="button secondary" type="button">やめる</button>
        </section>

        <section id="step-checking" class="step" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <p role="status">確認しています…</p>
        </section>

        <section id="step-done" class="step" hidden>
          <div class="icon" aria-hidden="true">✅</div>
          <p><strong>本人確認完了!</strong></p>
          <p id="auto-next-note" hidden>自動で画面遷移します。</p>
          <p id="verified-at"></p>
          <!-- 「助けに行く」から来たときは、1.5 秒ほどで次の画面へ自動で進む。押しても進める(?next=〇〇.html&id=依頼ID) -->
          <button id="next-button" class="button" type="button" hidden>次へ進む</button>
          <button id="reset-button" class="button secondary" type="button">もう一度ためす</button>
        </section>

        <p id="error" role="alert" hidden></p>
        <a class="back-link" href="./">トップにもどる</a>
      </div>
    </main>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./identity.js"></script>
  </body>
</html>
