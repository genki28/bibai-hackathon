<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>雪かき中</title>
    <!--
      【若者】雪かき中(helper-working.html?id=依頼ID)。経過時間は、サーバーに残した開始時刻から計算するので、
      画面を閉じて開き直しても続きから表示される。[雪かきを終える] を押すと、リーダーは範囲の画面(snow-area.html)へ。
      リーダー以外は「リーダー(〇〇さん)が範囲に丸を付けています」の表示になり、終わったら自動でお疲れ様の画面へ
      (?wait=1 が付いていると、最初からその表示)。リーダーは開始したときにランダムで決まり、ドット絵でも王冠が付く。
      雪かきの様子はドット絵(pixel-snow.js が Canvas に描く。背景と主人公は ChatGPT で作った画像 images/working-*.png)。参加者の人数ぶん主人公が並ぶ。タップするとコンボの演出が出る隠し機能(画面には説明を出さない。見た目だけで、スコアには入らない)。
      ページ一覧と URL は docs/features/pages.md、デザインは docs/design.md を見てください。
    -->
    <link rel="stylesheet" href="./template.css" />
    <style>
      /* ドット絵の雪かき(pixel-snow.js が Canvas に描く。画像ファイルは使わない) */
      .pixel-hud {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 8px 0 6px;
        font-family: var(--font-display);
        font-weight: 800;
      }
      .pixel-level {
        flex: none;
        margin: 0;
        padding: 3px 10px;
        color: var(--gold);
        background: var(--night-top);
        /* 角を四角く段々にした、ドット絵の枠 */
        box-shadow:
          0 -3px 0 0 var(--gold),
          0 3px 0 0 var(--gold),
          -3px 0 0 0 var(--gold),
          3px 0 0 0 var(--gold);
        letter-spacing: 0.04em;
      }
      .pixel-level small {
        margin-right: 6px;
        font-size: 0.75rem;
        color: var(--snow);
      }
      /* 次のレベルまでの進み具合(10 マス) */
      .pixel-bar {
        display: grid;
        flex: 1;
        grid-template-columns: repeat(10, 1fr);
        gap: 2px;
        height: 12px;
        padding: 2px;
        background: var(--night-top);
        box-shadow: 0 0 0 2px var(--ice);
      }
      .pixel-bar span {
        background: rgba(79, 209, 255, 0.15);
      }
      .pixel-bar span.is-on {
        background: var(--ice);
      }
      .pixel-stage {
        margin: 8px 0 14px;
        padding: 4px;
        background: var(--night-top);
        box-shadow:
          0 0 0 3px var(--ice),
          0 0 24px rgba(79, 209, 255, 0.35);
      }
      #pixel-canvas {
        display: block;
        width: 100%;
        aspect-ratio: 724 / 543;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      /* 画像が読み込めなかったときは、絵の場所ごと隠す(経過時間とボタンは使える) */
      .pixel-stage.is-unavailable {
        display: none;
      }
      .pixel-frame {
        position: relative;
      }
      /* 頭の上の名前の札(pixel-snow.js が位置を % で決める) */
      .crew-labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .crew-name {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 30%;
        padding: 0 4px;
        font-family: var(--font-display);
        font-size: 0.68rem;
        font-weight: 800;
        line-height: 1.25;
        white-space: nowrap;
        color: var(--snow);
        background: rgba(11, 16, 38, 0.78);
        box-shadow: 0 0 0 1px rgba(244, 248, 255, 0.5);
        transform: translate(-50%, -100%);
        transition: opacity 0.3s;
      }
      .crew-name.is-me {
        color: var(--gold);
        box-shadow: 0 0 0 2px var(--gold);
      }
      .crew-name.is-hidden {
        opacity: 0;
      }
      .crew-me-mark {
        position: absolute;
        top: 100%;
        font-size: 0.6rem;
        line-height: 1;
        color: var(--gold);
        text-shadow: 0 1px 0 var(--night-top);
      }
      #elapsed {
        margin: 0;
        font-size: clamp(3.2rem, 18vw, 4.5rem);
        /* ドット風: ぼかさない段々の影 */
        text-shadow:
          3px 3px 0 var(--night-top),
          6px 6px 0 rgba(139, 92, 246, 0.55);
      }
      .leader-role {
        margin: 6px 0 10px;
        font-weight: 800;
        color: var(--gold);
      }
      .leader-wait-crown {
        margin: 0;
        font-size: 3rem;
        animation: wait-bob 1.6s ease-in-out infinite;
      }
      @keyframes wait-bob {
        50% {
          transform: translateY(-6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .leader-wait-crown {
          animation: none;
        }
      }
      .elapsed-label {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        letter-spacing: 0.2em;
        color: var(--sub);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" />
    <script src="./design-theme.js"></script>
    <link rel="stylesheet" href="./snow-ui.css" />
    <link rel="stylesheet" href="./snow-pixel.css" />
  </head>
  <body class="for-helper">
    <main>
      <div class="brand-line"><a href="./" aria-label="ユキカキ・レイド ホーム">ユキカキ・レイド</a><span>美唄</span></div>
      <header class="page-head">
        <h1>雪かき中</h1>
      </header>
      <div id="work-view">
        <div class="pixel-hud">
          <p id="dig-level" class="pixel-level"><small>雪かきレベル</small>Lv.1</p>
          <div id="level-bar" class="pixel-bar" aria-hidden="true"></div>
        </div>
        <div class="pixel-stage">
          <div class="pixel-frame">
            <canvas id="pixel-canvas" width="362" height="272" aria-hidden="true"></canvas>
            <div id="crew-labels" class="crew-labels" aria-hidden="true"></div>
          </div>
        </div>
        <p class="elapsed-label center">経過時間</p>
        <p id="elapsed" class="big-number" role="timer">--:--</p>
        <p id="helper-names" class="note center"></p>
        <p id="leader-role" class="leader-role center" aria-live="polite"></p>
        <p class="rest-note">疲れたら、ひと休み。</p>
        <button id="finish-button" class="button" type="button">雪かきを終える</button>
      </div>
      <section id="leader-wait" class="card center" aria-live="polite" hidden>
        <p class="leader-wait-crown" aria-hidden="true">👑</p>
        <h2 id="leader-wait-title">少し待ってね</h2>
        <p id="leader-wait-text"></p>
        <p class="note">完了すると、自動で結果が表示されます。</p>
      </section>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./helper-working.js"></script>
  </body>
</html>
