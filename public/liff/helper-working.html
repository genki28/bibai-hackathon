<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>雪かき中</title>
    <!--
      【若者】雪かき中(helper-working.html?id=依頼ID)。経過時間は、サーバーに残した開始時刻から計算するので、
      画面を閉じて開き直しても続きから表示される。[雪かきを終える] で範囲の画面(snow-area.html)へ。
      雪かきの様子はドット絵(pixel-snow.js が Canvas に描く)。タップするとコンボの演出が出る(見た目だけで、スコアには入らない)。
      ページ一覧と URL は docs/features/pages.md、デザインは docs/design.md を見てください。
    -->
    <!-- 見出し・数字の字(M PLUS Rounded 1c)。読み込めないときは端末の字で表示される -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap"
    />
    <link rel="stylesheet" href="./template.css" />
    <style>
      /* ドット絵の雪かき(pixel-snow.js が Canvas に描く。画像ファイルは使わない) */
      .pixel-hud {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 8px 0 6px;
        font-family: var(--font-display);
        font-weight: 800;
      }
      .pixel-level {
        flex: none;
        margin: 0;
        padding: 3px 10px;
        color: var(--gold);
        background: var(--night-top);
        /* 角を四角く段々にした、ドット絵の枠 */
        box-shadow:
          0 -3px 0 0 var(--gold),
          0 3px 0 0 var(--gold),
          -3px 0 0 0 var(--gold),
          3px 0 0 0 var(--gold);
        letter-spacing: 0.04em;
      }
      .pixel-level small {
        margin-right: 6px;
        font-size: 0.75rem;
        color: var(--snow);
      }
      /* 次のレベルまでの進み具合(10 マス) */
      .pixel-bar {
        display: grid;
        flex: 1;
        grid-template-columns: repeat(10, 1fr);
        gap: 2px;
        height: 12px;
        padding: 2px;
        background: var(--night-top);
        box-shadow: 0 0 0 2px var(--ice);
      }
      .pixel-bar span {
        background: rgba(79, 209, 255, 0.15);
      }
      .pixel-bar span.is-on {
        background: var(--ice);
      }
      .pixel-stage {
        margin: 8px 0 14px;
        padding: 4px;
        background: var(--night-top);
        box-shadow:
          0 0 0 3px var(--ice),
          0 0 24px rgba(79, 209, 255, 0.35);
      }
      #pixel-canvas {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: manipulation;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      #elapsed {
        margin: 0;
        font-size: clamp(3.2rem, 18vw, 4.5rem);
        /* ドット風: ぼかさない段々の影 */
        text-shadow:
          3px 3px 0 var(--night-top),
          6px 6px 0 rgba(139, 92, 246, 0.55);
      }
      .elapsed-label {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        letter-spacing: 0.2em;
        color: var(--sub);
      }
    </style>
  </head>
  <body class="for-helper">
    <main>
      <header class="page-head">
        <p class="kicker">RAID IN PROGRESS</p>
        <h1>雪かき中!</h1>
      </header>
      <div class="pixel-hud">
        <p id="dig-level" class="pixel-level"><small>雪かきレベル</small>Lv.1</p>
        <div id="level-bar" class="pixel-bar" aria-hidden="true"></div>
      </div>
      <div class="pixel-stage">
        <canvas id="pixel-canvas" width="160" height="120" aria-hidden="true"></canvas>
      </div>
      <p class="elapsed-label center">経過時間</p>
      <p id="elapsed" class="big-number" role="timer">--:--</p>
      <p id="helper-names" class="note center"></p>
      <p class="note center">絵をタップすると、雪をすばやく投げられます。連続でコンボ!</p>
      <button id="finish-button" class="button" type="button">雪かきを終える</button>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./helper-working.js"></script>
  </body>
</html>
