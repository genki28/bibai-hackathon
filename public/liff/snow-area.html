<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>雪かきをした範囲</title>
    <!--
      【若者】雪かきをした範囲を地図に筆で塗る(snow-area.html?id=依頼ID)。塗ったところの面積を出す(brush-area.js)。
      [地図を動かす]/[筆で塗る] を切り替え、塗るモードのときは指でなぞったところが塗られる。筆は細い(1.5m)/太い(4m)。
      [1 つ戻す] で最後のひと筆を消す。[雪かきを完了する] で終了(API)→ お疲れ様(finish.html)。範囲を付けて終了できるのはリーダーだけ
      (リーダー以外が開いたら、雪かき中の画面の「リーダーを待つ」表示へ移る)。面積は 5,000 ㎡ まで。
      ページ一覧と URL は docs/features/pages.md、デザインは docs/design.md を見てください。
    -->
    <link rel="stylesheet" href="./template.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      /* ---- この画面だけの見た目(範囲を描く地図) ---- */
      .map-wrap {
        position: relative;
      }
      /* 今のモードを地図の右上に出す(地図の操作のじゃまをしない) */
      .mode-badge {
        position: absolute;
        top: 18px;
        right: 10px;
        z-index: 1000;
        margin: 0;
        padding: 4px 12px;
        border-radius: 999px;
        font-family: var(--font-display);
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--snow);
        background: rgba(11, 16, 38, 0.8);
        box-shadow: 0 0 0 1px var(--glass-edge) inset;
        pointer-events: none;
      }
      .map-wrap.is-drawing .mode-badge {
        color: var(--night-top);
        background: var(--gold);
        box-shadow: 0 0 14px rgba(255, 201, 77, 0.7);
      }
      /* 描くモードのときは地図の枠を金色にして、ひと目で分かるようにする */
      #area-map.is-drawing {
        border: 3px solid var(--gold);
        box-shadow: 0 0 18px rgba(255, 201, 77, 0.45);
      }
      #area-map.is-drawing,
      #area-map.is-drawing .leaflet-grab {
        cursor: crosshair;
      }
      /* 筆で塗る Canvas(brush-area.js)。地図の上に重ねる。塗るモードのときだけ指の操作を受け取る */
      .brush-canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 450;
        pointer-events: none;
        touch-action: none;
      }
      .brush-canvas.is-brush {
        pointer-events: auto;
        cursor: crosshair;
      }
      .brush-size {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin: 8px 0 0;
      }
      .brush-size button {
        min-height: 40px;
        padding: 4px 14px;
        border: 2px solid var(--rule, #dce1e6);
        background: var(--paper, #fff);
        font: inherit;
        cursor: pointer;
      }
      .brush-size button[aria-pressed="true"] {
        border-color: var(--vermillion, #b73e2c);
        color: #fff;
        background: var(--vermillion, #b73e2c);
      }
      .area-hint {
        min-height: 2.6em;
        margin: 4px 0 0;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;display=swap" />
    <script src="./design-theme.js"></script>
    <link rel="stylesheet" href="./snow-ui.css" />
    <link rel="stylesheet" href="./snow-pixel.css" />
  </head>
  <body class="for-helper">
    <main>
      <div class="brand-line"><a href="./" aria-label="ユキカキ・レイド ホーム">ユキカキ・レイド</a><span>美唄</span></div>
      <header class="page-head">
        <h1>作業範囲を記録</h1>
      </header>
      <div class="card">
        <div class="toggle" role="group" aria-label="地図の操作の切り替え">
          <button id="mode-move" type="button" aria-pressed="true">地図を動かす</button>
          <button id="mode-draw" type="button" aria-pressed="false">筆で塗る</button>
        </div>
        <p id="area-hint" class="note center area-hint" aria-live="polite"></p>
        <div id="map-wrap" class="map-wrap">
          <div id="area-map" class="map-box tall"></div>
          <p id="mode-badge" class="mode-badge" aria-hidden="true"></p>
        </div>
        <div class="brush-size" role="group" aria-label="筆の太さ">
          <button id="brush-thin" type="button" aria-pressed="true">細い筆</button>
          <button id="brush-thick" type="button" aria-pressed="false">太い筆</button>
        </div>
        <p id="area-size" class="big-number">0 ㎡</p>
        <p id="area-limit" class="note center">5,000 ㎡ まで</p>
        <div class="button-row">
          <button id="undo-button" class="button secondary" type="button">1 つ戻す</button>
          <button id="reset-button" class="button secondary" type="button">やり直す</button>
        </div>
      </div>
      <button id="finish-button" class="button" type="button" disabled>雪かきを完了する</button>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./snow-area.js"></script>
  </body>
</html>
