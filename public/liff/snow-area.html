<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>雪かきをした範囲</title>
    <!--
      【若者】雪かきをした範囲を地図に描く(snow-area.html?id=依頼ID)。地図をタップすると点が増え、点を結んだ形の面積を出す。
      [雪かき終了!] で終了(API)→ お疲れ様(finish.html)。
      ページ一覧と URL は docs/features/pages.md を見てください。
    -->
    <link rel="stylesheet" href="./template.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body class="for-helper">
    <main>
      <h1>雪かきをした範囲に<br />丸を付けてね</h1>
      <p class="note center">地図を指でタップして、範囲の角に点を置いてください(3 つ以上)。</p>
      <div id="area-map" class="map-box tall"></div>
      <p id="area-size" class="big-number">0 ㎡</p>
      <div class="button-row">
        <button id="undo-button" class="button secondary" type="button">1 つ戻す</button>
        <button id="reset-button" class="button secondary" type="button">やり直す</button>
      </div>
      <button id="finish-button" class="button" type="button" disabled>雪かき終了!</button>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./snow-area.js"></script>
  </body>
</html>
