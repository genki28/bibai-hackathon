<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>デザイン比較 — ユキカキ・レイド</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="./snow-ui.css" />
    <style>
      h1 { margin-top: 36px; }
      section { margin: 36px 0; border-top: 1px solid var(--rule); padding-top: 20px; }
      .sample { padding: 24px; background: var(--wash); font-size: 1.5rem; }
      .sample img { width: 100%; display: block; image-rendering: pixelated; }
      a { color: var(--ink); }
      .button { text-decoration: none; }

  <body>
    <main>
      <div class="brand-line"><a href="./">ユキカキ・レイド</a><span>デザイン比較</span></div>
      <h1>ふたつの見た目</h1>
      <p class="note">画面を移動しても、このタブでは選んだ見た目が続きます。</p>
      <section>
        <h2>01　スポーツ誌風</h2>
        <p>白い余白、紺の文字、大きな数字。</p>
        <a class="button" href="./go-help.html?list=1&amp;design=editorial">若者の画面を見る</a>
        <a class="button secondary" href="./help-waiting.html?design=editorial">お年寄りの画面を見る</a>
      </section>
      <section>
        <h2>02　ドット絵</h2>
        <div class="sample"><img src="./images/pixel-town.svg" alt="雪の町で二人が雪かきをしているドット絵" /></div>
        <p>雪の町、四角い枠、ゲームの文字。</p>
        <a class="button" href="./go-help.html?list=1&amp;design=pixel">若者の画面を見る</a>
        <a class="button secondary" href="./help-waiting.html?design=pixel">お年寄りの画面を見る</a>
      </section>
      <p class="note">助けを呼ぶフォームは比較対象に含みません。</p>
    </main>
  </body>
