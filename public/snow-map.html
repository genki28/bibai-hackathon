<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>美唄の雪山マップ | ユキカキ・レイド</title>
    <meta name="description" content="美唄で、みんなが雪かきで使ったカロリーが、地図の上の雪山になって積み上がっていきます。" />
    <!--
      美唄の雪山マップ(snow-map.html)。だれでも見られる普通の Web ページ(LIFF ではない)。
      終わった雪かき 1 件が、地図の上の雪山 1 つ。一緒にやった全員の消費カロリーが、段々の雪山の層になって積み上がる。
      地図は MapLibre GL(3D の地図のライブラリ)+ OpenFreeMap(登録の要らない地図)。形の計算は snow-map/snow-mountain.js、
      画面の動きは snow-map/snow-map.js、データは GET /api/snow-map(家の正確な位置・住所・お年寄りの名前は出さない)。
      ?demo を付けると、見本の雪山を出す(まだ雪かきが少ないときの説明用)。
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.19.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./snow-map/snow-map.css" />
  </head>
  <body>
    <div id="map" aria-label="美唄の地図と雪山"></div>
    <canvas id="snowfall" aria-hidden="true"></canvas>

    <!-- 上: 検索窓のような見出しと、数のチップ -->
    <header class="top">
      <div class="searchbar">
        <span class="live" aria-hidden="true"></span>
        <div class="searchbar-text">
          <h1>美唄の雪山マップ</h1>
          <p id="headline">読み込み中…</p>
        </div>
      </div>
      <div class="chips" aria-live="polite">
        <span class="chip"><b id="stat-piles">0</b> 雪山</span>
        <span class="chip"><b id="stat-people">0</b> 人が参加</span>
        <span class="chip"><b id="stat-calories">0</b> kcal</span>
        <span class="chip chip-fun" id="stat-fun"></span>
      </div>
      <p id="demo-note" class="demo-note" hidden>見本のデータで表示しています</p>
    </header>

    <!-- 右: 丸いボタン -->
    <div class="fabs">
      <button id="toggle-3d" class="fab" type="button" aria-pressed="true" title="3D / 2D">3D</button>
      <button id="toggle-spin" class="fab" type="button" aria-pressed="false" title="ぐるっと回す">⟳</button>
      <button id="reset-view" class="fab" type="button" title="美唄全体を見る">⌂</button>
    </div>

    <!-- 下: ボトムシート(雪山の一覧 / 選んだ雪山の詳しい中身) -->
    <section id="sheet" class="sheet" aria-label="雪山の一覧">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheet-list">
        <h2>最近できた雪山</h2>
        <ul id="pile-list" class="pile-list"></ul>
      </div>
      <div id="sheet-detail" hidden>
        <button id="detail-back" class="detail-back" type="button">← 一覧へ</button>
        <h2 id="detail-title"></h2>
        <p id="detail-sub" class="detail-sub"></p>
        <ul id="detail-bars" class="bars" aria-label="一緒にやった人の消費カロリー"></ul>
      </div>
    </section>

    <script type="module" src="./snow-map/snow-map.js"></script>
  </body>
</html>
