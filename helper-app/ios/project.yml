# XcodeGen の設定(これから Xcode のプロジェクト BibaiHelper.xcodeproj を作る。.xcodeproj は Git に入れない)
# 作り方: helper-app/ios で `xcodegen generate`
name: BibaiHelper
options:
  bundleIdPrefix: jp.bibai.yukikaki
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # サーバーの URL(Info.plist の BibaiApiBase に入る)。手元のサーバーで試すときは、起動の引数 -BibaiApiBase で変えられる
    BIBAI_API_BASE: https://bibai-yukikaki.gba-to-web-slide.workers.dev
targets:
  # 純粋な計算(スコップ計・筆の面積・実況のことば・音の合言葉・距離)。画面から分けて、単体テストする
  HelperCore:
    type: framework
    platform: iOS
    sources:
      - Sources/HelperCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.bibai.yukikaki.helper.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  # iPhone アプリ本体
  BibaiHelper:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Resources
    dependencies:
      - target: HelperCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.bibai.yukikaki.helper
        PRODUCT_NAME: BibaiHelper
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # 純粋な計算の単体テスト(XCTest)
  HelperCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/HelperCoreTests
    dependencies:
      - target: HelperCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.bibai.yukikaki.helper.tests
  # 画面のボタンを押して確かめる UI テスト(手元のサーバーが要る)
  BibaiHelperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      - target: BibaiHelper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.bibai.yukikaki.helper.uitests
        TEST_TARGET_NAME: BibaiHelper
schemes:
  BibaiHelper:
    build:
      targets:
        BibaiHelper: all
        HelperCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HelperCoreTests
  # 手元のサーバーで、画面のボタンを押して確かめる UI テスト(サーバーが要るので、ふだんのテストとは分けている)
  BibaiHelperUITests:
    build:
      targets:
        BibaiHelperUITests: [test]
    test:
      config: Debug
      targets:
        - BibaiHelperUITests
